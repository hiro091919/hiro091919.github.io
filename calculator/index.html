<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>競泳レース分析アプリケーション</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col overflow-hidden">
    <!-- ヘッダー設定コントロール -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-2 flex flex-wrap items-center justify-between gap-2 shrink-0">
        <div class="flex items-center space-x-2">
            <h1 class="text-base font-bold text-cyan-400 flex items-center gap-1">🏊‍♂️ 競泳レース分析</h1>
            
            <!-- 大会名プルダウン -->
            <div class="flex items-center space-x-1 text-xs bg-slate-700 px-2 py-1 rounded">
                <label class="text-slate-300">大会:</label>
                <select id="compSelect" class="bg-slate-800 text-white rounded px-1 py-0.5 border border-slate-600 focus:outline-none"></select>
            </div>

            <!-- 短水路 / 長水路 -->
            <div class="flex items-center space-x-1 text-xs bg-slate-700 px-2 py-1 rounded">
                <label class="text-slate-300">水路:</label>
                <select id="courseType" class="bg-slate-800 text-white rounded px-1 py-0.5 border border-slate-600 focus:outline-none" onchange="updateEventOptions()">
                    <option value="短水路">短水路</option>
                    <option value="長水路">長水路</option>
                </select>
            </div>

            <!-- マスタ同期ボタン -->
            <button onclick="syncMastersFromSheet()" class="bg-amber-600 hover:bg-amber-500 text-white px-2.5 py-1 rounded text-xs font-bold shadow transition flex items-center gap-1">
                🔄 マスタ同期
            </button>
        </div>

        <div class="flex items-center space-x-2">
            <!-- 種目 & 距離 -->
            <div class="flex items-center space-x-1 text-xs bg-slate-700 px-2 py-1 rounded">
                <label class="text-slate-300">種目:</label>
                <select id="eventSelect" class="bg-slate-800 text-white rounded px-1 py-0.5 border border-slate-600 focus:outline-none" onchange="onEventChange()">
                    <option value="自由形">自由形</option>
                    <option value="バタフライ">バタフライ</option>
                    <option value="背泳ぎ">背泳ぎ</option>
                    <option value="平泳ぎ">平泳ぎ</option>
                    <option value="個人メドレー">個人メドレー</option>
                    <option value="フリーリレー">フリーリレー</option>
                    <option value="メドレーリレー">メドレーリレー</option>
                </select>
                <select id="distanceSelect" class="bg-slate-800 text-white rounded px-1 py-0.5 border border-slate-600 focus:outline-none" onchange="buildLapTable()"></select>
            </div>

            <!-- リレー専用オプション -->
            <div id="relayOptions" class="hidden flex items-center space-x-2 text-xs bg-cyan-950 border border-cyan-700 px-2 py-1 rounded">
                <label class="text-cyan-300 font-semibold">区分:</label>
                <select id="relayGender" class="bg-slate-800 text-white rounded px-1 py-0.5 border border-slate-600">
                    <option value="男子">男子</option>
                    <option value="女子">女子</option>
                    <option value="混合">混合</option>
                </select>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <div class="flex-1 flex overflow-hidden p-2 gap-2">
        <!-- 左側：動画 & 再生バー -->
        <div class="flex-1 flex flex-col bg-slate-800/80 rounded-lg p-2 border border-slate-700 relative">
            <div class="flex justify-between items-center mb-1 text-xs">
                <div class="flex items-center space-x-2">
                    <input type="file" id="videoUpload" accept="video/*" class="text-xs text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-cyan-700 file:text-white hover:file:bg-cyan-600">
                </div>
                <div class="text-slate-400">
                    動画時間: <span id="videoTimeDisp" class="font-mono text-white">0.00s</span> | レース経過: <span id="raceTimeDisp" class="font-mono text-cyan-400 font-bold">0.00s</span>
                </div>
            </div>

            <!-- 動画表示エリア -->
            <div class="flex-1 relative bg-black rounded overflow-hidden flex items-center justify-center">
                <video id="mainVideo" class="max-h-full max-w-full object-contain" preload="metadata"></video>
            </div>

            <!-- 動画シークバー -->
            <div class="mt-1 px-1">
                <input type="range" id="videoSeekBar" value="0" min="0" max="100" step="0.01" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-400">
            </div>

            <!-- コントロールバー -->
            <div class="mt-1 flex items-center justify-between text-xs bg-slate-900/90 p-1.5 rounded">
                <div class="flex items-center space-x-1">
                    <button onclick="skipTime(-1.0)" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded">◀ 1秒</button>
                    <button onclick="skipTime(-0.1)" class="bg-cyan-900 hover:bg-cyan-800 text-cyan-200 border border-cyan-700 px-2 py-1 rounded font-bold">◀ 0.1秒</button>
                    <button onclick="togglePlay()" id="playBtn" class="bg-cyan-600 hover:bg-cyan-500 px-3 py-1 rounded font-bold">▶ 再生</button>
                    <button onclick="skipTime(0.1)" class="bg-cyan-900 hover:bg-cyan-800 text-cyan-200 border border-cyan-700 px-2 py-1 rounded font-bold">0.1秒 ▶</button>
                    <button onclick="skipTime(1.0)" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded">1秒 ▶</button>
                    <select id="playbackSpeed" onchange="changeSpeed()" class="bg-slate-800 text-white rounded px-1 py-0.5 ml-2">
                        <option value="0.25">0.25x</option>
                        <option value="0.5">0.5x</option>
                        <option value="1.0" selected>1.0x</option>
                    </select>
                </div>

                <div class="flex items-center space-x-2">
                    <span class="text-slate-300">スタート経過: <span id="baselineDiffDisp" class="font-mono text-cyan-300 font-bold text-sm">0.00s</span></span>
                    <button onclick="setStartBaseline()" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1 rounded font-bold shadow animate-pulse">
                        🏁 スタート設定
                    </button>
                </div>
            </div>
        </div>

        <!-- 右側：常時表示の分析表 & 入力パネル -->
        <div class="w-[440px] bg-slate-800/90 rounded-lg p-3 border border-slate-700 flex flex-col justify-between overflow-hidden">
            <div class="flex flex-col h-full">
                <div class="flex justify-between items-center border-b border-slate-700 pb-1 mb-2">
                    <h2 class="text-sm font-bold text-cyan-300">📊 レース分析表</h2>
                    <!-- スプレッドシートへ直接アクセスするボタン -->
                    <a href="https://docs.google.com/spreadsheets/d/1I456M5-mpV_H4UZq--i6mrB0hYspoZmpki4OgT6wi94/edit" target="_blank" class="bg-emerald-700 hover:bg-emerald-600 text-white px-2 py-0.5 rounded text-[11px] font-bold shadow flex items-center gap-1">
                        📑 スプレッドシートを開く
                    </a>
                </div>
                
                <!-- 単式用 メンバー選択 -->
                <div id="singleSwimmerSection" class="mb-2">
                    <label class="text-xs text-slate-400 block mb-1">泳者名 (メンバーマスタ):</label>
                    <select id="swimmerName" class="w-full bg-slate-900 border border-slate-600 text-white rounded p-1 text-xs"></select>
                </div>

                <!-- リレー用 4名選択セクション -->
                <div id="relaySwimmersSection" class="hidden mb-2 space-y-1 bg-slate-900/60 p-2 rounded border border-slate-700 text-xs">
                    <div class="font-bold text-cyan-400 mb-1">リレー4泳者選択:</div>
                    <div class="flex items-center gap-1"><span class="w-12 text-slate-400">1泳:</span><select class="relay-swimmer-input flex-1 bg-slate-800 text-white rounded p-0.5 border border-slate-600"></select></div>
                    <div class="flex items-center gap-1"><span class="w-12 text-slate-400">2泳:</span><select class="relay-swimmer-input flex-1 bg-slate-800 text-white rounded p-0.5 border border-slate-600"></select></div>
                    <div class="flex items-center gap-1"><span class="w-12 text-slate-400">3泳:</span><select class="relay-swimmer-input flex-1 bg-slate-800 text-white rounded p-0.5 border border-slate-600"></select></div>
                    <div class="flex items-center gap-1"><span class="w-12 text-slate-400">4泳:</span><select class="relay-swimmer-input flex-1 bg-slate-800 text-white rounded p-0.5 border border-slate-600"></select></div>
                </div>

                <!-- 分析表テーブル（スクロール可能） -->
                <div class="flex-1 overflow-y-auto border border-slate-700 rounded my-1">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-slate-800 text-cyan-300 border-b border-slate-700 sticky top-0">
                                <th class="p-1.5">計測ポイント</th>
                                <th class="p-1.5">タイム (例: 005498)</th>
                                <th class="p-1.5">現在値</th>
                                <th class="p-1.5">区間ラップ</th>
                            </tr>
                        </thead>
                        <tbody id="lapTableBody"></tbody>
                    </table>
                </div>

                <!-- 同期用URL確認・変更欄 -->
                <div class="mt-2 bg-slate-900 p-2 rounded border border-slate-700 text-xs space-y-1">
                    <label class="text-slate-300 block font-semibold">同期用GAS WebApp URL (確認用):</label>
                    <input type="text" id="gasUrlInput" value="https://script.google.com/macros/s/AKfycbyLgrbQQXAVqMU5-j7eTJgPnnexJL-HVNtAZwMjt58hMwk5OlHp-kKZfWbjOSjzqMk38A/exec" class="w-full bg-slate-800 border border-slate-600 text-slate-300 rounded p-1 text-[11px] font-mono">
                </div>
            </div>

            <button onclick="saveDataToSpreadsheet()" class="w-full mt-2 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded text-xs font-bold shadow transition shrink-0 flex items-center justify-center gap-1">
                ☁️ スプレッドシートに記録・保存する
            </button>
        </div>
    </div>

    <script>
        let video = document.getElementById('mainVideo');
        let seekBar = document.getElementById('videoSeekBar');
        let startBaseline = 0;

        let masterComps = [
            { name: "第65回 都道府県対抗水泳競技大会", date: "2026-10-10" },
            { name: "秋季短水路記録会", date: "2026-09-25" },
            { name: "夏季選手権水泳競技大会", date: "2026-08-15" }
        ];

        let masterSwimmers = [
            "山田 太郎", "鈴木 一郎", "佐藤 花子", "高橋 健太", "塚口 弘之"
        ];

        async function syncMastersFromSheet() {
            let gasUrl = document.getElementById('gasUrlInput').value.trim();
            if (!gasUrl) {
                alert('GASのURLが設定されていません。');
                return;
            }

            try {
                let response = await fetch(gasUrl + "?action=getMasters");
                if (response.ok) {
                    let data = await response.json();
                    if (data.competitions && data.competitions.length > 0) {
                        masterComps = data.competitions;
                    }
                    if (data.swimmers && data.swimmers.length > 0) {
                        masterSwimmers = data.swimmers;
                    }
                    populateMastersUI();
                    alert('スプレッドシートから最新の大会・メンバーマスタを同期しました！');
                    return;
                }
            } catch (e) {
                console.error(e);
            }
            alert('同期に失敗しました。CORSポリシーまたはURLをご確認ください。');
        }

        function populateMastersUI() {
            let compSelect = document.getElementById('compSelect');
            compSelect.innerHTML = '';
            masterComps.forEach(c => {
                let opt = document.createElement('option');
                opt.value = `${c.name} (${c.date})`;
                opt.text = `${c.name} (${c.date})`;
                compSelect.appendChild(opt);
            });

            let swimmerSelect = document.getElementById('swimmerName');
            swimmerSelect.innerHTML = '';
            masterSwimmers.forEach(s => {
                let opt = document.createElement('option');
                opt.value = s;
                opt.text = s;
                swimmerSelect.appendChild(opt);
            });

            let relaySelects = document.querySelectorAll('.relay-swimmer-input');
            relaySelects.forEach((sel, idx) => {
                sel.innerHTML = '';
                masterSwimmers.forEach((s, sIdx) => {
                    let opt = document.createElement('option');
                    opt.value = s;
                    opt.text = s;
                    if (sIdx === idx % masterSwimmers.length) opt.selected = true;
                    sel.appendChild(opt);
                });
            });
        }

        const distanceMap = {
            '自由形': [25, 50, 100, 200, 400, 800, 1500],
            'バタフライ': [25, 50, 100, 200],
            '背泳ぎ': [25, 50, 100, 200],
            '平泳ぎ': [25, 50, 100, 200],
            '個人メドレー': [100, 200, 400],
            'フリーリレー': [100, 200, 400, 800],
            'メドレーリレー': [100, 200, 400]
        };

        function updateEventOptions() {
            let ev = document.getElementById('eventSelect').value;
            let distSelect = document.getElementById('distanceSelect');
            distSelect.innerHTML = '';
            let distances = distanceMap[ev] || [50, 100, 200];
            distances.forEach(d => {
                let opt = document.createElement('option');
                opt.value = d;
                opt.text = (ev.includes('リレー')) ? `${d}m (${d/4}m×4)` : `${d}m`;
                distSelect.appendChild(opt);
            });
            buildLapTable();
        }

        function onEventChange() {
            let ev = document.getElementById('eventSelect').value;
            let isRelay = ev.includes('リレー');
            document.getElementById('relayOptions').classList.toggle('hidden', !isRelay);
            document.getElementById('relaySwimmersSection').classList.toggle('hidden', !isRelay);
            document.getElementById('singleSwimmerSection').classList.toggle('hidden', isRelay);
            updateEventOptions();
        }

        let lapPointsConfig = [];
        function buildLapTable() {
            let course = document.getElementById('courseType').value;
            let ev = document.getElementById('eventSelect').value;
            let dist = parseInt(document.getElementById('distanceSelect').value);
            let tbody = document.getElementById('lapTableBody');
            tbody.innerHTML = '';

            lapPointsConfig = [];
            if (ev.includes('リレー')) {
                let legDist = course === '短水路' ? 25 : 50;
                for (let l = 1; l <= 4; l++) {
                    for (let d = legDist; d <= dist / 4; d += legDist) {
                        lapPointsConfig.push(`第${l}泳者 ${d}m`);
                    }
                }
            } else {
                if (dist === 50 || dist === 25) {
                    lapPointsConfig = ['15m', '25m', dist === 50 ? '35m' : '25m (Finish)', dist === 50 ? '45m' : '', dist === 50 ? '50m (Finish)' : ''].filter(Boolean);
                } else if (course === '短水路') {
                    lapPointsConfig = ['15m', '25m', '50m', '75m'];
                    for (let d = 100; d <= dist; d += 25) lapPointsConfig.push(`${d}m`);
                } else {
                    lapPointsConfig = ['15m', '50m', '100m'];
                    for (let d = 150; d <= dist; d += 50) lapPointsConfig.push(`${d}m`);
                }
            }

            lapPointsConfig.forEach((pt, index) => {
                let tr = document.createElement('tr');
                tr.className = 'border-b border-slate-800 hover:bg-slate-800/50';
                tr.innerHTML = `
                    <td class="p-1.5 font-medium text-slate-300">${pt}</td>
                    <td class="p-1.5"><input type="text" id="time-input-${index}" onblur="formatAndCalculateLap(${index})" placeholder="005498" class="w-20 bg-slate-800 text-cyan-300 font-mono rounded px-1 text-xs border border-slate-600 text-center"></td>
                    <td class="p-1.5"><button onclick="reflectCurrentTime(${index})" class="bg-cyan-900 hover:bg-cyan-800 text-cyan-200 border border-cyan-700 px-1.5 py-0.5 rounded text-[10px]">現在値</button></td>
                    <td class="p-1.5 font-mono text-slate-400 text-center" id="lap-diff-${index}">-</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function reflectCurrentTime(index) {
            let diff = Math.max(0, video.currentTime - startBaseline);
            let totalCentiseconds = Math.round(diff * 100);
            let centiStr = String(totalCentiseconds % 100).padStart(2, '0');
            let totalSec = Math.floor(totalCentiseconds / 100);
            
            let timeCode = "";
            if (totalSec >= 60) {
                let min = Math.floor(totalSec / 60);
                let sec = totalSec % 60;
                timeCode = `${min}${String(sec).padStart(2, '0')}${centiStr}`;
            } else {
                timeCode = `${String(totalSec).padStart(2, '0')}${centiStr}`;
            }

            let inputElem = document.getElementById(`time-input-${index}`);
            inputElem.value = timeCode;
            formatAndCalculateLap(index);
        }

        function formatAndCalculateLap(index) {
            let inputElem = document.getElementById(`time-input-${index}`);
            let rawVal = inputElem.value.trim();
            if (!rawVal) return;

            let halfVal = rawVal.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/[^0-9]/g, '');
            if (halfVal.length > 0) {
                if (halfVal.length <= 4) {
                    let secPart = halfVal.slice(0, -2) || '0';
                    let millisPart = halfVal.slice(-2).padEnd(2, '0');
                    inputElem.value = `${secPart}.${millisPart}`;
                } else {
                    let minPart = halfVal.slice(0, -4) || '0';
                    let secPart = halfVal.slice(-4, -2);
                    let millisPart = halfVal.slice(-2);
                    inputElem.value = `${minPart}:${secPart}.${millisPart}`;
                }
            }
            calculateAllLaps();
        }

        function calculateAllLaps() {
            let prevTimeSec = 0;
            lapPointsConfig.forEach((pt, index) => {
                let inputElem = document.getElementById(`time-input-${index}`);
                let diffElem = document.getElementById(`lap-diff-${index}`);
                if (!inputElem || !inputElem.value) {
                    if(diffElem) diffElem.innerText = '-';
                    return;
                }
                let curTimeSec = parseTimeStringToSeconds(inputElem.value);
                if (index === 0) {
                    if(diffElem) {
                        diffElem.innerText = `+${curTimeSec.toFixed(2)}s`;
                        diffElem.className = 'p-1.5 font-mono text-emerald-400 font-bold text-center';
                    }
                    prevTimeSec = curTimeSec;
                } else {
                    let lapSec = curTimeSec - prevTimeSec;
                    if(diffElem && curTimeSec >= prevTimeSec) {
                        diffElem.innerText = `+${lapSec.toFixed(2)}s`;
                        diffElem.className = 'p-1.5 font-mono text-emerald-400 font-bold text-center';
                    } else if(diffElem) {
                        diffElem.innerText = '-';
                        diffElem.className = 'p-1.5 font-mono text-slate-400 text-center';
                    }
                    prevTimeSec = curTimeSec;
                }
            });
        }

        function parseTimeStringToSeconds(str) {
            if (str.includes(':')) {
                let parts = str.split(':');
                return parseInt(parts[0])*60 + parseFloat(parts[1]);
            }
            return parseFloat(str) || 0;
        }

        async function saveDataToSpreadsheet() {
            let comp = document.getElementById('compSelect').value;
            let course = document.getElementById('courseType').value;
            let eventName = document.getElementById('eventSelect').value + ' ' + document.getElementById('distanceSelect').value + 'm';
            let isRelay = document.getElementById('eventSelect').value.includes('リレー');
            let gender = isRelay ? document.getElementById('relayGender').value : '-';
            let swimmer = isRelay ? Array.from(document.querySelectorAll('.relay-swimmer-input')).map(s => s.value).join(', ') : document.getElementById('swimmerName').value;

            let lapsData = {};
            lapPointsConfig.forEach((pt, index) => {
                let val = document.getElementById(`time-input-${index}`).value;
                if (val) lapsData[pt] = val;
            });

            let payload = {
                timestamp: new Date().toLocaleString(),
                competition: comp,
                course: course,
                event: eventName,
                category: gender,
                swimmer: swimmer,
                laps: lapsData
            };

            let gasUrl = document.getElementById('gasUrlInput').value.trim();
            if (!gasUrl) {
                alert('GASのURLが設定されていません。');
                return;
            }

            try {
                let response = await fetch(gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert('Googleスプレッドシート（分析記録シート）へのデータ保存が完了しました！');
            } catch (err) {
                console.error(err);
                alert('送信に失敗しました。');
            }
        }

        document.getElementById('videoUpload').addEventListener('change', (e) => {
            let file = e.target.files[0];
            if (file) video.src = URL.createObjectURL(file);
        });

        video.addEventListener('loadedmetadata', () => {
            seekBar.max = video.duration;
        });

        video.addEventListener('timeupdate', () => {
            document.getElementById('videoTimeDisp').innerText = video.currentTime.toFixed(2) + 's';
            let diff = video.currentTime - startBaseline;
            document.getElementById('raceTimeDisp').innerText = diff.toFixed(2) + 's';
            document.getElementById('baselineDiffDisp').innerText = (diff >= 0 ? diff.toFixed(2) + 's' : `-${Math.abs(diff).toFixed(2)}s`);
            if (!video.seeking) {
                seekBar.value = video.currentTime;
            }
        });

        seekBar.addEventListener('input', () => {
            video.currentTime = seekBar.value;
        });

        function skipTime(sec) { video.currentTime = Math.max(0, video.currentTime + sec); }
        function togglePlay() {
            if (video.paused) { video.play(); document.getElementById('playBtn').innerText = '⏸ 一時停止'; }
            else { video.pause(); document.getElementById('playBtn').innerText = '▶ 再生'; }
        }
        function changeSpeed() { video.playbackRate = parseFloat(document.getElementById('playbackSpeed').value); }
        
        function setStartBaseline() {
            startBaseline = video.currentTime;
            let diff = video.currentTime - startBaseline;
            document.getElementById('baselineDiffDisp').innerText = diff.toFixed(2) + 's';
            alert(`スタート基準を設定しました (${startBaseline.toFixed(2)}s)`);
        }

        window.onload = () => {
            populateMastersUI();
            updateEventOptions();
            syncMastersFromSheet();
        };
    </script>
</body>
</html>
