<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Cygnets Record</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center">

    <!-- モバイル風メイン容器 (ライト系) -->
    <div class="w-full max-w-md bg-white border-x border-slate-200 min-h-screen flex flex-col shadow-xl">
        
        <!-- ヘッダー（タイトルバー） - 指定色 #b94047 ベース -->
        <header class="px-4 py-3 text-center border-b border-rose-900 shrink-0 text-white" style="background: linear-gradient(to right, #b94047, #962c33);">
            <h1 class="text-base font-black tracking-wider mb-0.5">
                Team Cygnets Record🦢
            </h1>
            <p class="text-[10px] text-rose-200">レース結果確認ツール</p>
        </header>

        <!-- 選手選択エリア -->
        <div class="p-3 bg-slate-50 border-b border-slate-200 flex flex-col gap-1.5">
            <div class="flex items-center justify-between">
                <label for="swimmerSelect" class="text-xs text-slate-600 font-bold">👤 選手選択:</label>
                <div class="flex items-center gap-1.5">
                    <span id="syncStatus" class="text-[10px] text-emerald-600 font-medium">✅ 同期完了</span>
                    <button onclick="syncAndLoadData()" title="再読込・同期" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-[10px] px-1.5 py-0.5 rounded transition font-medium">
                        🔄 再読込
                    </button>
                </div>
            </div>
            <select id="swimmerSelect" onchange="onSwimmerChange()" class="w-full bg-white border border-slate-300 text-slate-800 text-sm rounded p-2 focus:outline-none focus:border-rose-600 shadow-sm">
                <option value="">選手を選択してください...</option>
            </select>
        </div>

        <!-- 選手プロフィール表示カード -->
        <div id="profileSection" class="p-3 bg-white border-b border-slate-200 flex items-center gap-3">
            <div class="w-12 h-12 bg-rose-50 rounded-full flex items-center justify-center border-2 border-rose-500 text-xl shrink-0 shadow-inner">
                🏊‍♂️
            </div>
            <div class="flex-1 text-xs">
                <div class="text-base font-bold text-slate-800" id="dispName">選手名未選択</div>
            </div>
        </div>

        <!-- 絞り込みフィルターエリア (年度・泳法のみ) -->
        <div class="p-2.5 bg-slate-100 border-b border-slate-200 grid grid-cols-2 gap-2 text-xs">
            <div>
                <label class="text-[11px] text-slate-600 block mb-1 font-semibold">📅 年度絞り込み:</label>
                <select id="filterYear" onchange="renderRecordsList()" class="w-full bg-white text-slate-800 rounded p-1.5 border border-slate-300 text-xs shadow-sm">
                    <option value="all">すべての年度</option>
                </select>
            </div>
            <div>
                <label class="text-[11px] text-slate-600 block mb-1 font-semibold">🏊 泳法絞り込み:</label>
                <select id="filterStroke" onchange="renderRecordsList()" class="w-full bg-white text-slate-800 rounded p-1.5 border border-slate-300 text-xs shadow-sm">
                    <option value="all">すべての泳法</option>
                </select>
            </div>
        </div>

        <!-- 記録一覧セクションヘッダー -->
        <div class="bg-slate-200 px-4 py-2 border-b border-slate-300 text-xs font-bold text-slate-700 flex justify-between items-center">
            <span>📋 レース記録一覧 (新しい順)</span>
            <span id="recordCount" class="text-[10px] text-slate-500">全0件</span>
        </div>

        <!-- レース記録リスト -->
        <div id="recordsList" class="flex-1 overflow-y-auto p-2 space-y-2 bg-slate-50">
            <div class="text-center text-xs text-slate-400 py-8">選手を選択すると記録が表示されます</div>
        </div>

        <!-- フッター -->
        <footer class="p-3 bg-white border-t border-slate-200 text-center text-[10px] text-slate-400">
            Team Cygnets Record v1.0
        </footer>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyLgrbQQXAVqMU5-j7eTJgPnnexJL-HVNtAZwMjt58hMwk5OlHp-kKZfWbjOSjzqMk38A/exec";

        let swimmersMaster = ["山田 太郎", "鈴木 一郎", "佐藤 花子", "高橋 健太", "塚口 弘之"];
        let allRecords = [];
        let competitionDatesMap = {}; // 大会名ごとの正しい開催日を保持するマップ

        window.onload = async () => {
            await syncAndLoadData();
        };

        // マスタおよび記録データを最新に同期
        async function syncAndLoadData() {
            const statusElem = document.getElementById('syncStatus');
            statusElem.innerText = '🔄 同期中...';
            try {
                // キャッシュを防ぐタイムスタンプを付与
                const res = await fetch(GAS_URL + "?action=getMasters&_t=" + new Date().getTime());
                if (res.ok) {
                    const data = await res.json();
                    
                    // 大会マスタから正確な開催日マップを構築 (A列=name, B列=date)
                    competitionDatesMap = {};
                    if (data.competitions && data.competitions.length > 0) {
                        data.competitions.forEach(c => {
                            let compName = "";
                            let compDate = "";
                            if (Array.isArray(c)) {
                                compName = c[0] || "";
                                compDate = c[1] || "";
                            } else if (typeof c === 'object' && c !== null) {
                                compName = c.name || c.competition || c.title || "";
                                compDate = c.date || c.開催日 || "";
                            }
                            if (compName && compDate) {
                                // YYYY/MM/DD を YYYY-MM-DD に正規化して保持
                                competitionDatesMap[compName.trim()] = String(compDate).trim().replace(/\//g, '-');
                            }
                        });
                    }

                    if (data.swimmers && data.swimmers.length > 0) {
                        swimmersMaster = data.swimmers.map(s => typeof s === 'string' ? s : s.name);
                    }
                    if (data.records && data.records.length > 0) {
                        allRecords = data.records;
                    }
                    statusElem.innerText = '✅ 同期完了';
                } else {
                    statusElem.innerText = '⚠️ オフライン';
                }
            } catch (e) {
                console.error(e);
                statusElem.innerText = '⚠️ 同期失敗(キャッシュ)';
            }
            initSwimmerDropdown();
            updateFilterOptions();
            renderRecordsList();
        }

        function initSwimmerDropdown() {
            const select = document.getElementById('swimmerSelect');
            const currentVal = select.value;
            select.innerHTML = '<option value="">選手を選択してください...</option>';
            swimmersMaster.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.text = s;
                select.appendChild(opt);
            });
            if (currentVal) select.value = currentVal;
        }

        function onSwimmerChange() {
            updateFilterOptions();
            renderRecordsList();
        }

        function updateFilterOptions() {
            const selectedName = document.getElementById('swimmerSelect').value;
            const yearSelect = document.getElementById('filterYear');
            const strokeSelect = document.getElementById('filterStroke');

            const currentYearVal = yearSelect.value;
            const currentStrokeVal = strokeSelect.value;

            yearSelect.innerHTML = '<option value="all">すべての年度</option>';
            strokeSelect.innerHTML = '<option value="all">すべての泳法</option>';

            if (!selectedName) return;

            const myRecords = allRecords.filter(r => r.swimmer && r.swimmer.includes(selectedName));
            
            const years = new Set();
            const strokes = new Set();

            myRecords.forEach(r => {
                const dateStr = extractDateStr(r);
                if (dateStr) {
                    const yearPart = dateStr.split(/[-/]/)[0];
                    if (yearPart && yearPart.length === 4) {
                        years.add(yearPart);
                    }
                }
                if (r.event) {
                    const strokeName = r.event.split(' ')[0];
                    strokes.add(strokeName);
                }
            });

            Array.from(years).sort().reverse().forEach(y => {
                const opt = document.createElement('option');
                opt.value = y;
                opt.text = `${y}年度`;
                yearSelect.appendChild(opt);
            });

            Array.from(strokes).sort().forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.text = s;
                strokeSelect.appendChild(opt);
            });

            if (currentYearVal) yearSelect.value = currentYearVal;
            if (currentStrokeVal) strokeSelect.value = currentStrokeVal;
        }

        function renderRecordsList() {
            const selectedName = document.getElementById('swimmerSelect').value;
            const recordsContainer = document.getElementById('recordsList');
            recordsContainer.innerHTML = '';

            if (!selectedName) {
                document.getElementById('dispName').innerText = '選手名未選択';
                document.getElementById('recordCount').innerText = '全0件';
                recordsContainer.innerHTML = '<div class="text-center text-xs text-slate-400 py-8">選手を選択すると記録が表示されます</div>';
                return;
            }

            document.getElementById('dispName').innerText = selectedName;

            let myRecords = allRecords.filter(r => r.swimmer && r.swimmer.includes(selectedName));

            const selectedYear = document.getElementById('filterYear').value;
            const selectedStroke = document.getElementById('filterStroke').value;

            if (selectedYear !== 'all') {
                myRecords = myRecords.filter(r => extractDateStr(r).startsWith(selectedYear));
            }
            if (selectedStroke !== 'all') {
                myRecords = myRecords.filter(r => r.event && r.event.startsWith(selectedStroke));
            }

            myRecords.sort((a, b) => new Date(extractDateStr(b)) - new Date(extractDateStr(a)));

            document.getElementById('recordCount').innerText = `全${myRecords.length}件`;

            if (myRecords.length === 0) {
                recordsContainer.innerHTML = '<div class="text-center text-xs text-slate-400 py-8">該当するレース記録がありません</div>';
                return;
            }

            const pbMap = {};
            const allMyRecords = allRecords.filter(r => r.swimmer && r.swimmer.includes(selectedName));
            allMyRecords.forEach(r => {
                const key = `${r.event}_${r.course}`;
                const finishTimeSec = extractFinishTimeSec(r.laps);
                if (finishTimeSec > 0) {
                    if (!pbMap[key] || finishTimeSec < pbMap[key].timeSec) {
                        pbMap[key] = {
                            timeSec: finishTimeSec,
                            date: extractDateStr(r),
                            competition: cleanCompName(r.competition)
                        };
                    }
                }
            });

            myRecords.forEach((rec, idx) => {
                const key = `${rec.event}_${rec.course}`;
                const finishTimeSec = extractFinishTimeSec(rec.laps);
                const finishTimeStr = formatSecondsToTime(finishTimeSec);
                const pb = pbMap[key];

                const isLongCourse = rec.course && rec.course.includes("長水路");
                const courseBadgeClass = isLongCourse 
                    ? "bg-blue-100 border border-blue-300 text-blue-700 text-[10px] px-1.5 py-0.5 rounded font-bold"
                    : "bg-rose-100 border border-rose-300 text-rose-700 text-[10px] px-1.5 py-0.5 rounded font-bold";
                const detailLinkClass = isLongCourse ? "text-blue-600" : "text-rose-600";

                let pbDiffHtml = '<span class="text-slate-400 text-[11px]">PB計測対象</span>';
                if (pb && finishTimeSec > 0) {
                    const diffSec = finishTimeSec - pb.timeSec;
                    if (Math.abs(diffSec) <= 0.005) {
                        pbDiffHtml = `<span class="bg-amber-100 border border-amber-300 text-amber-800 text-[10px] px-1.5 py-0.5 rounded font-black">★ 自己ベスト (PB)</span>`;
                    } else {
                        const diffColor = isLongCourse ? "text-blue-600" : "text-rose-600";
                        pbDiffHtml = `<span class="${diffColor} font-mono font-bold text-xs">+${diffSec.toFixed(2)}</span> <span class="text-[10px] text-slate-500">(PB: ${formatSecondsToTime(pb.timeSec)} / ${pb.date})</span>`;
                    }
                }

                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-lg overflow-hidden shadow-sm";
                const dateStr = extractDateStr(rec);

                card.innerHTML = `
                    <div class="bg-slate-50 p-2.5 border-b border-slate-200 flex justify-between items-center cursor-pointer hover:bg-slate-100 transition" onclick="toggleLapDetail(${idx})">
                        <div>
                            <div class="flex items-center gap-1.5">
                                <span class="${courseBadgeClass}">${rec.course}</span>
                                <span class="font-bold text-sm text-slate-800">${rec.event}</span>
                            </div>
                            <div class="text-[11px] text-slate-500 mt-0.5">${cleanCompName(rec.competition)}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs text-slate-400 font-mono">${dateStr}</div>
                            <div class="text-base font-black text-slate-900 font-mono hover:underline">${finishTimeStr}</div>
                        </div>
                    </div>

                    <div class="p-2 bg-slate-50/60 flex justify-between items-center text-xs border-b border-slate-100">
                        <div class="flex items-center gap-1">
                            ${pbDiffHtml}
                        </div>
                        <button onclick="toggleLapDetail(${idx})" class="text-[11px] ${detailLinkClass} hover:underline flex items-center gap-0.5 font-medium">
                            ⏱️ ラップ詳細 <span id="arrow-${idx}">▼</span>
                        </button>
                    </div>

                    <div id="lapDetail-${idx}" class="hidden bg-white p-2 text-xs border-t border-slate-100 space-y-1">
                        <div class="font-bold ${isLongCourse ? 'text-blue-700' : 'text-rose-700'} border-b border-slate-100 pb-1 text-[11px]">【ラップ・スプリットタイム】</div>
                        ${buildLapRowsHtml(rec.laps, isLongCourse)}
                    </div>
                `;
                recordsContainer.appendChild(card);
            });
        }

        function toggleLapDetail(idx) {
            const detail = document.getElementById(`lapDetail-${idx}`);
            const arrow = document.getElementById(`arrow-${idx}`);
            if (detail) {
                const isHidden = detail.classList.contains('hidden');
                detail.classList.toggle('hidden', !isHidden);
                if (arrow) arrow.innerText = isHidden ? '▲' : '▼';
            }
        }

        function extractFinishTimeSec(laps) {
            if (!laps) return 0;
            let lapsObj = typeof laps === 'string' ? JSON.parse(laps) : laps;
            const keys = Object.keys(lapsObj);
            if (keys.length === 0) return 0;
            const finishKey = keys.find(k => k.includes('Finish') || k.includes('50m') || k.includes('100m') || k.includes('200m')) || keys[keys.length - 1];
            return parseTimeToSec(lapsObj[finishKey]);
        }

        function buildLapRowsHtml(laps, isLongCourse) {
            if (!laps) return '<div class="text-slate-400">ラップ記録なし</div>';
            let lapsObj = typeof laps === 'string' ? JSON.parse(laps) : laps;
            let html = '<table class="w-full text-left border-collapse text-[11px] mt-1">';
            html += '<tr class="text-slate-400 border-b border-slate-100"><th class="py-1">地点</th><th class="py-1 text-right">タイム</th></tr>';

            let prevSec = 0;
            Object.keys(lapsObj).forEach((pt, i) => {
                const timeSec = parseTimeToSec(lapsObj[pt]);
                const diffSec = i === 0 ? timeSec : (timeSec - prevSec);
                html += `
                    <tr class="border-b border-slate-50">
                        <td class="py-1 font-medium text-slate-700">${pt}</td>
                        <td class="py-1 text-right font-mono text-slate-900 font-bold">${lapsObj[pt]} <span class="text-[10px] text-slate-400 font-normal">(+${diffSec.toFixed(2)})</span></td>
                    </tr>
                `;
                prevSec = timeSec;
            });
            html += '</table>';
            return html;
        }

        function parseTimeToSec(str) {
            if (!str) return 0;
            let s = String(str).trim();
            if (s.includes(':')) {
                let parts = s.split(':');
                return parseInt(parts[0]) * 60 + parseFloat(parts[1]);
            }
            return parseFloat(s) || 0;
        }

        function formatSecondsToTime(sec) {
            if (!sec || sec <= 0) return "-";
            if (sec >= 60) {
                let min = Math.floor(sec / 60);
                let remainder = (sec % 60).toFixed(2);
                return `${min}:${remainder.padStart(5, '0')}`;
            }
            return sec.toFixed(2);
        }

        // --- 修正: 大会マスタ（competitionDatesMap）の最新日付を最優先で適用する日付抽出関数 ---
        function extractDateStr(rec) {
            if (!rec) return "2026-10-01";

            // 1. レコードの大会名（cleaned）が最新のマスタ日付一覧に存在すれば、マスタ側の開催日を最優先で返す
            if (rec.competition) {
                const cleanName = cleanCompName(rec.competition);
                if (competitionDatesMap[cleanName]) {
                    return competitionDatesMap[cleanName];
                }
            }

            // 2. レコード自体に独立した日付プロパティがあれば使用
            if (rec.date) {
                const m = String(rec.date).match(/\d{4}[-/]\d{2}[-/]\d{2}/);
                if (m) return m[0].replace(/\//g, '-');
            }

            // 3. 従来どおり文字列内から抽出
            if (rec.competition) {
                const match = rec.competition.match(/(\d{4}[-/]\d{2}[-/]\d{2})/);
                if (match) return match[1].replace(/\//g, '-');
            }
            if (rec.timestamp) {
                const match = rec.timestamp.match(/(\d{4}[-/]\d{2}[-/]\d{2})/);
                if (match) return match[1].replace(/\//g, '-');
            }

            return "2026-10-01";
        }

        function cleanCompName(comp) {
            if (!comp) return "大会名未設定";
            return comp.replace(/\s*[\(\（]?\d{4}[-/]\d{2}[-/]\d{2}[\)\）]?/, '').trim();
        }
    </script>
</body>
</html>
